name: Image CI Releases

on:
  push:
    tags:
      - v*

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange.
      id-token: write
    # Pins the OIDC token subject to
    # repo:cilium/hubble-export-stdout:environment:release, which is the
    # identity federated with the Quay robot account.
    environment:
      name: release
      deployment: false
    strategy:
      matrix:
        include:
          - name: hubble-export-stdout
            dockerfile: ./Dockerfile

    steps:
      # Quay's registry endpoint only accepts credentials or a JWT signed by
      # Quay itself, so the GitHub OIDC token cannot be used as the registry
      # password directly. Trade it for a short lived robot token first.
      #
      # Because the job references an environment, the subject of the token is
      # repo:cilium@21054566/hubble-export-stdout@492054882:environment:release,
      # the immutable form that carries the owner and repository ids. That is
      # the identity federated with the robot account on the Quay side, so
      # renaming the environment breaks the login.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_RELEASE }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_RELEASE }}
          password: ${{ steps.registry-token.outputs.token }}

      - name: Getting image tag
        id: tag
        run: |
          echo ::set-output name=tag::${GITHUB_REF##*/}

      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Release Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker_build_release
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            quay.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}

      - name: Image Release Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ matrix.name }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.docker_build_release.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### ${{ matrix.name }}" > image-digest/${{ matrix.name }}.txt
          echo "" >> image-digest/${{ matrix.name }}.txt
          echo "\`quay.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_release.outputs.digest }}\`" >> image-digest/${{ matrix.name }}.txt
          echo "" >> image-digest/${{ matrix.name }}.txt

      # Upload artifact digests
      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

  image-digests:
    if: ${{ github.repository == 'cilium/hubble-export-stdout' }}
    name: Display Digests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat
